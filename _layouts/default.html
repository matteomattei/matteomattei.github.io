<!DOCTYPE html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xml:lang="en"
  lang="en"
  prefix="og: http://ogp.me/ns#"
>
  {% include head.html %}
  <body class="theme-base-matteo">
    <header class="masthead">
      <div class="masthead-inner">
        <div class="img-circular"></div>
        <h1>{{ site.title }}</h1>
        <p class="lead">{{ site.description }}</p>

        <div class="colophon">
          <ul class="colophon-links">
            <li>
              <a href="/">Blog</a>
            </li>
            <li>
              <a href="/services/">Services</a>
            </li>
            <li>
              <a href="/projects/">Projects</a>
            </li>
            <li>
              <a href="/about/">About</a>
            </li>
            <li>
              <a href="/personal/">Personal</a>
            </li>
            <!--<li>
              <a href="/sponsors/">Sponsors</a>
	    </li>-->
            <li>
              <a href="/contacts/">Contacts</a>
            </li>
          </ul>
          <p class="copyright">
            &copy; 2006-{{ site.time | date: '%Y' }} {{ site.author.name }} -
            all rights reserved.<br />VAT number: 06751410488. My
            <a href="https://github.com/matteomattei/matteomattei.github.io"
              >blog code</a
            >
          </p>
          <a href="https://it.linkedin.com/in/matteomattei"
            ><img
              class="img-feed"
              src="/public/site_images/iconmonstr-linkedin-3-icon.svg"
              alt="linkedin"
          /></a>
          <a href="/atom.xml"
            ><img
              class="img-feed"
              src="/public/site_images/iconmonstr-rss-3-icon.svg"
              alt="rss"
          /></a>
          <a href="https://twitter.com/matte0matte1"
            ><img
              class="img-feed"
              src="/public/site_images/iconmonstr-twitter-3-icon.svg"
              alt="twitter"
          /></a>
          <a href="https://github.com/matteomattei"
            ><img
              class="img-feed"
              src="/public/site_images/iconmonstr-github-8-icon.svg"
              alt="github"
          /></a>
          <a href="https://www.facebook.com/matte0matte1"
            ><img
              class="img-feed"
              src="/public/site_images/iconmonstr-facebook-3-icon.svg"
              alt="facebook"
          /></a>
        </div>
      </div>
    </header>

    <div class="content container">
      {{ content }}
      <hr />
    </div>

    <div class="sharethis-sticky-share-buttons"></div>

    <script
      type="text/javascript"
      src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
    ></script>
    <script type="text/javascript">
      document.addEventListener("DOMContentLoaded", function () {
        /* css above the fold */
        var css = document.createElement("link");
        css.rel = "stylesheet";
        css.href =
          "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css";
        document.head.appendChild(css);

        /* initialize sintax highlight */
        hljs.highlightAll();

        /* disqus */
        var s = document.createElement("script");
        s.async = true;
        s.type = "text/javascript";
        s.src = "https://" + disqus_shortname + ".disqus.com/count.js";
        document.head.appendChild(s);
      });
    </script>
  </body>
</html>
